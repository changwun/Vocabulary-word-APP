version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: quiz-mysql
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=quiz_db
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - luckyvoca-network

  redis:
    image: redis:7.2-alpine
    container_name: quiz-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    networks:
      - luckyvoca-network

  backend:
    image: ${DOCKER_IMAGE_BACKEND}:latest
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/quiz_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
    depends_on:
      - mysql
      - redis
    networks:
      - luckyvoca-network

  frontend:
    image: ${DOCKER_IMAGE_FRONTEND}:latest
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - luckyvoca-network

networks:
  luckyvoca-network:
    driver: bridge
