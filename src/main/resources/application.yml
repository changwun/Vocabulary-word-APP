spring:
  datasource:
    url: jdbc:mysql://localhost:3306/quiz_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    # 환경 변수가 없으면 콜론(:) 뒤의 기본값을 사용하도록 설정
    username: ${DB_USERNAME:quiz_user}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # 최신 버전에서는 Dialect를 명시하지 않아도 자동 감지되므로 제거하거나 최신으로 변경
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# JWT 설정
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000 # 1시간

logging:
  level:
    org.hibernate.SQL: debug
    com.example.quiz: debug
