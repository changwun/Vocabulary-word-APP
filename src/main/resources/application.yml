spring:
  datasource:
    url: jdbc:mysql://localhost:3307/quiz_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:quiz_user}
    password: ${DB_PASSWORD:quiz_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# JWT 설정 (환경 변수 필수)
jwt:
  secret: ${JWT_SECRET:your_very_long_and_secure_random_secret_key_at_least_32_chars}
  expiration: 3600000 # 1시간

